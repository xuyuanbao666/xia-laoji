name: Android installation smoke
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - name: Install SDK and prepare clean Android build
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:?Android SDK missing}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$manager"
          "$manager" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"
          # Ignore platform-specific caches and local paths from old commits.
          rm -rf mobile/android/.gradle mobile/android/app/build mobile/android/build
          printf 'sdk.dir=%s\n' "$sdk" > mobile/android/local.properties
      - name: Build standalone test-signed APK
        working-directory: mobile/android
        run: bash gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=x86_64
      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-evidence
          apk=mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk" | tee android-evidence/signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | tee android-evidence/badging.txt
          grep -F "package: name='com.xialaojinew'" android-evidence/badging.txt
          grep -F 'x86_64' android-evidence/badging.txt
          unzip -l "$apk" | grep -F 'assets/index.android.bundle'
          cp "$apk" android-evidence/xia-laoji-emulator-test.apk
          (cd android-evidence && sha256sum xia-laoji-emulator-test.apk > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and verify actual login screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 mobile/scripts/android_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-test-evidence
          path: android-evidence/
          if-no-files-found: warn
          retention-days: 14
