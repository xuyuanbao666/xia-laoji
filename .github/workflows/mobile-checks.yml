name: Mobile authentication checks
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx jest --preset react-native --ci --runInBand src/services/__tests__
      - run: npx tsc --noEmit
